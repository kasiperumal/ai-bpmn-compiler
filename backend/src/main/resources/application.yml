spring:
  application:
    name: ai-bpmn-compiler
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    # OpenAI Configuration (Default)
    openai:
      api-key: ${OPENAI_API_KEY:your-openai-api-key-here}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 4096
    
    # Vertex AI Gemini Configuration (Alternative)
    vertex:
      ai:
        gemini:
          project-id: ${VERTEX_AI_PROJECT_ID:your-project-id}
          location: ${VERTEX_AI_LOCATION:us-central1}
          api-key: ${GEMINI_API_KEY:your-api-key-here}
          chat:
            options:
              model: gemini-2.0-flash-exp
              temperature: 0.7
              maxOutputTokens: 4096

server:
  port: 8080

# Application configuration
app:
  upload:
    base-dir: ./data/uploads
  kogito:
    bpmn-dir: ./data/kogito/processes
    drl-dir: ./data/kogito/rules
  ai:
    # AI Provider Selection: "openai" or "gemini"
    # Default: openai (using gpt-4o)
    provider: ${AI_PROVIDER:openai}

# Kogito configuration
kogito:
  service:
    url: http://localhost:8080
  processes:
    # Enable process management REST API
    management:
      enabled: true
  # Enable Kogito REST endpoints
  rest:
    enabled: true
  # Enable Drools rule execution
  rules:
    enabled: true

# Logging
logging:
  level:
    root: INFO
    com.example.aibpmn: DEBUG
    org.drools: DEBUG
    org.kie: DEBUG
    org.kie.kogito: DEBUG
    org.jbpm: DEBUG
