spring:
  application:
    name: ai-bpmn-compiler
  
  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:aibpmn;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # H2 Console (for development/debugging)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  ai:
    # OpenAI Configuration (Default)
    openai:
      api-key: 
      chat:
        options:
          model: gpt-4o
          temperature: 0.5
          max-tokens: 4096
    
    # Vertex AI Gemini Configuration (Alternative)
    vertex:
      ai:
        gemini:
          project-id: ${VERTEX_AI_PROJECT_ID:gen-lang-client-0526458881}
          location: ${VERTEX_AI_LOCATION:us-central1}
          api-key: 
          chat:
            options:
              model: gemini-2.0-flash-exp
              temperature: 0.5
              maxOutputTokens: 4096

server:
  port: 8080

# Application configuration
app:
  upload:
    base-dir: ./data/uploads
  kogito:
    bpmn-dir: ./data/kogito/processes
    drl-dir: ./data/kogito/rules
  ai:
    # AI Provider Selection: "openai" or "gemini"
    # Default: openai (using gpt-4o)
    provider: ${AI_PROVIDER:openai}

# Kogito configuration
kogito:
  service:
    url: http://localhost:8080
  processes:
    # Enable process management REST API
    management:
      enabled: true
  # Enable Kogito REST endpoints
  rest:
    enabled: true
  # Enable Drools rule execution
  rules:
    enabled: true

# Logging
logging:
  level:
    root: INFO
    com.example.aibpmn: DEBUG
    org.drools: DEBUG
    org.kie: DEBUG
    org.kie.kogito: DEBUG
    org.jbpm: DEBUG
