spring:
  application:
    name: ai-bpmn-compiler-test
  main:
    allow-bean-definition-overriding: true
  ai:
    openai:
      api-key: test-key
      chat:
        enabled: false
    vertex:
      ai:
        gemini:
          enabled: false

app:
  ai:
    provider: test
  upload:
    base-dir: ./build/test-data/uploads
  kogito:
    bpmn-dir: ./build/test-data/kogito/processes
    drl-dir: ./build/test-data/kogito/rules

server:
  port: 0

logging:
  level:
    root: WARN
    com.example.aibpmn: INFO

